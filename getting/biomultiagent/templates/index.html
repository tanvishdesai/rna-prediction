<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BioMultiAgent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #145a32; }
    textarea { width: 100%; height: 100px; font-size: 1rem; padding: 0.5rem; }
    button { background: #145a32; color: white; border: none; padding: 0.6rem 1.2rem; cursor: pointer; }
    pre { background: #f4f6f7; padding: 1rem; white-space: pre-wrap; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>BioMultiAgent</h1>
  <p>Multi-agent bioinformatics: sequence, alignment, annotation, phylogeny, literature.</p>
  <textarea id="query">Translate ATGGCCATTGTAATGGGCCGCTGAAAGGGTGCCCGATAG, find ORFs, align homologs, build a tree, and search PubMed.</textarea>
  <br><button onclick="run()">Analyze</button>
  <pre id="out"></pre>
  <script>
    async function run() {
      const q = document.getElementById('query').value;
      const fd = new FormData();
      fd.append('query', q);
      const res = await fetch('/analyze', {method: 'POST', body: fd});
      const data = await res.json();
      document.getElementById('out').textContent = data.result || data.error;
    }
  </script>
</body>
</html>
