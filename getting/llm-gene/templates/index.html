<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM-Gene · Bioinformatics Q&A</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #1a5276; }
    textarea { width: 100%; height: 80px; font-size: 1rem; padding: 0.5rem; }
    button { background: #1a5276; color: white; border: none; padding: 0.6rem 1.2rem; cursor: pointer; margin-top: 0.5rem; }
    .answer { background: #f4f6f7; padding: 1rem; margin-top: 1rem; border-radius: 6px; white-space: pre-wrap; }
    .source { font-size: 0.85rem; color: #555; margin-top: 0.5rem; padding: 0.5rem; background: #eaf2f8; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>LLM-Gene</h1>
  <p>Ask questions about genes, variants, and proteins. Answers are grounded in ClinVar and UniProt.</p>
  <textarea id="query" placeholder="What TP53 variants are pathogenic?"></textarea>
  <br><button onclick="ask()">Ask</button>
  <div id="result"></div>
  <script>
    async function ask() {
      const q = document.getElementById('query').value;
      const res = await fetch('/gene-qa', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query: q})
      });
      const data = await res.json();
      let html = '<div class="answer">' + (data.answer || data.error) + '</div>';
      (data.sources || []).forEach((s, i) => {
        html += '<div class="source">[' + (i+1) + '] ' + s.source + ' · ' + s.gene + ': ' + s.text.slice(0,200) + '…</div>';
      });
      document.getElementById('result').innerHTML = html;
    }
  </script>
</body>
</html>
